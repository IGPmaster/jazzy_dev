<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Page not found - Jazzy Spins</title>
<style>
  body{margin:0;min-height:100vh;display:flex;align-items:center;justify-content:center;
       background:#140f42;color:#e3e4eb;font-family:system-ui,-apple-system,sans-serif;
       text-align:center;padding:24px;box-sizing:border-box}
  .w{max-width:32rem}
  h1{font-size:clamp(1.6rem,5vw,2.4rem);margin:0 0 .75rem;color:#feb708}
  p{margin:0 0 1.5rem;line-height:1.6;color:#babac9}
  a{display:inline-block;background:#dd0524;color:#fff;text-decoration:none;
    font-weight:700;padding:.75rem 1.5rem;border-radius:7px}
</style>
</head>
<body>
  <div class="w">
    <h1>That page isn't here</h1>
    <p>The link may be out of date, or the address may have a typo in it.</p>
    <a href="/">Back to the home page</a>
  </div>
</body>
</html>
